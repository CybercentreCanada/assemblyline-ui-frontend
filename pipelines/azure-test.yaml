name: tests

trigger:
  branches:
    include:
      - '*'
pr:
  branches:
    include:
      - '*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '10.34.9'

jobs:
  - job: run_tests
    timeoutInMinutes: 15

    steps:
      - checkout: self
        displayName: 'Checkout repository'

      - task: NodeTool@0
        inputs:
          versionSpec: $(NODE_VERSION)
        displayName: 'Install Node.js $(NODE_VERSION)'

      - script: |
          npm i -g pnpm@$(PNPM_VERSION)
          pnpm --version
        displayName: 'Install PNPM'

      - script: |
          # Try to checkout the matching branch, if the command fails, don't care.
          export BRANCH_NAME=$(basename -- "$SYSTEM_PULLREQUEST_SOURCEBRANCH")
          export BRANCH_NAME=${BRANCH_NAME:-"$BUILD_SOURCEBRANCHNAME"}
          git checkout -b $BRANCH_NAME -t origin/$BRANCH_NAME || true
          pnpm install
        displayName: 'Install dependencies (pnpm)'

      - script: |
          set -xv  # Echo commands before they are run
          pnpm run typecheck
        displayName: 'TypeScript check'

      - script: |
          set -xv  # Echo commands before they are run
          pnpm run test:ci
        displayName: 'Run tests with coverage'

      - script: |
          set -xv  # Echo commands before they are run
          pnpm run lint:ci
        displayName: 'ESLint'

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: $(System.DefaultWorkingDirectory)/test-results/vitest.xml
          testRunTitle: 'Vitest unit tests'
        condition: succeededOrFailed()
        displayName: 'Publish unit test results'

      - task: PublishCodeCoverageResults@2
        inputs:
          codeCoverageTool: Cobertura
          summaryFileLocation: $(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml
        condition: succeededOrFailed()
        displayName: 'Publish code coverage results'
